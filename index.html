<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="shortcut icon" href="https://tse3.mm.bing.net/th/id/OIP.lrQb-nWyc9Ohq5fmzSs_8wHaHa?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" type="image/x-icon">
    <title>Máquina de Vendas </title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Máquina de Vendas (AFD)</h1>
        <div class="machine-panel">
            <div class="display">
                <span id="label-estado">Estado Atual: </span>
                <span id="saldo">R$ 0.00</span>
            </div>
            
            <div id="status-mensagem" class="status-msg">Insira moedas (Produto: R$ 0.30)</div>

            <div class="coin-buttons">
                <button class="coin-btn" onclick="inserirMoeda(0.05)">+ R$ 0.05</button>
                <button class="coin-btn" onclick="inserirMoeda(0.10)">+ R$ 0.10</button>
                <button class="coin-btn" onclick="inserirMoeda(0.25)">+ R$ 0.25</button>
            </div>

            <div class="action-buttons">
                <button id="btn-reset" onclick="resetarMaquina()">Reiniciar</button>
            </div>
        </div>

        <div class="graph-info">
            <h3>Legenda dos Estados</h3>
            <p><strong>Estados Normais (&lt; R$ 0,30):</strong> R$ 0.00, R$ 0.05, R$ 0.10, R$ 0.15, R$ 0.20, R$ 0.25</p>
            <p><strong>Estados Finais (&ge; R$ 0,30 - Libera Produto + Troco):</strong> R$ 0.30, R$ 0.35, R$ 0.40, R$ 0.45, R$ 0.50</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
