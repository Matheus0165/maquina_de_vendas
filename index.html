<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Máquina de Vendas - Industrial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="machine">
        <h2 class="title">AUTO-ATENDIMENTO</h2>
        
        <div class="panel">
            <!-- Coluna Esquerda: Dinheiro -->
            <div class="left-col">
                <div class="label-group">
                    <div class="label">SALDO INSERIDO</div>
                    <div class="label-alert" id="limite-alerta" style="display: none;">LIMITE: $ 0.30</div>
                </div>
                
                <div class="visor" id="visor-container">
                    <span class="currency">$</span> 
                    <span id="saldo">0.00</span>
                </div>
                
                <!-- Novo Painel de Mensagens -->
                <div class="status-screen" id="status-screen">AGUARDANDO...</div>
                
                <div class="label mt-20">INSERIR MOEDAS:</div>
                <div class="coin-buttons">
                    <button class="btn coin-btn" onclick="inserir(5)">$ 0.05</button>
                    <button class="btn coin-btn" onclick="inserir(10)">$ 0.10</button>
                    <button class="btn coin-btn" onclick="inserir(25)">$ 0.25</button>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Coluna Direita: Troco e Escolha -->
            <div class="right-col">
                <div class="troco-section">
                    <div class="label center">COMPARTIMENTO DE TROCO</div>
                    <div class="slot troco-slot" id="troco-slot"></div>
                    <div class="hint center" id="troco-hint">Vazio</div>
                    
                    <!-- Botões de ação do troco -->
                    <div class="troco-actions" id="troco-actions" style="display: none;">
                        <button class="action-btn return-btn" onclick="reaproveitarTroco()">+ SALDO</button>
                        <button class="action-btn take-btn" onclick="retirarTroco()">RETIRAR</button>
                    </div>
                </div>

                <div class="label mt-20">SELECIONE O PRODUTO:</div>
                <div class="product-buttons">
                    <button class="btn prod-btn" onclick="comprar(50, '🥤')">
                        <span class="prod-icon">🥤</span> 
                        <span class="prod-name">Copo de Refri</span> 
                        <span class="prod-price">$0.50</span>
                    </button>
                    <button class="btn prod-btn" onclick="comprar(45, '🥔')">
                        <span class="prod-icon">🥔</span> 
                        <span class="prod-name">Salgadinho</span> 
                        <span class="prod-price">$0.45</span>
                    </button>
                    <button class="btn prod-btn" onclick="comprar(40, '🍫')">
                        <span class="prod-icon">🍫</span> 
                        <span class="prod-name">Barrinha</span> 
                        <span class="prod-price">$0.40</span>
                    </button>
                    <button class="btn prod-btn" onclick="comprar(35, '🥛')">
                        <span class="prod-icon">🥛</span> 
                        <span class="prod-name">Copo de Água</span> 
                        <span class="prod-price">$0.35</span>
                    </button>
                    <button class="btn prod-btn" onclick="comprar(30, '🍬')">
                        <span class="prod-icon">🍬</span> 
                        <span class="prod-name">Bala</span> 
                        <span class="prod-price">$0.30</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Parte Inferior: Saída de Produto -->
        <div class="bottom-panel">
            <div class="label center">SAÍDA DE PRODUTOS</div>
            <div class="slot product-slot" id="produto-slot" onclick="pegarProduto()"></div>
            <div class="hint center">Clique no produto para retirar da bandeja</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
